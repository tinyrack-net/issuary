name: Tune Windows network stack
description: >-
  Chromium surfaces net::ERR_NO_BUFFER_SPACE (WinSock WSAENOBUFS) when several
  browser workers open sockets at the same time on a Windows runner, which the
  smoke and screen suites report as a failed client script request. Widen the
  ephemeral TCP port range and stop the receive window from autotuning so each
  connection keeps a small buffer.

runs:
  using: composite
  steps:
    - name: Tune the TCP stack
      shell: pwsh
      run: |
        netsh int ipv4 set dynamicport tcp start=10000 num=55000
        netsh int tcp set global autotuninglevel=disabled
        netsh int tcp show global
