name: CI

on:
  push:
    tags: ['v*']
  pull_request:
  merge_group:
  schedule:
    # 03:00 KST
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: tinyrack-net/issuary
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_USERNAME: tinyrack
  DOCKERHUB_IMAGE_NAME: tinyrack/issuary

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancelling a merge-group run ejects the pull request from the queue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      full: ${{ steps.scope.outputs.full }}
      frontend: ${{ steps.scope.outputs.frontend }}
      server: ${{ steps.scope.outputs.server }}
      standalone: ${{ steps.scope.outputs.standalone }}
      tools: ${{ steps.scope.outputs.tools }}
      homepage: ${{ steps.scope.outputs.homepage }}
      examples: ${{ steps.scope.outputs.examples }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: { fetch-depth: 1 }
      - id: scope
        name: Classify the change
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=""
          if [ -n "${PR_NUMBER}" ]; then
            files="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')" || {
              echo "::warning::Could not read the PR file list; using full scope"
              files=""
            }
          elif [ -n "${MERGE_BASE_SHA}" ] && [ -n "${MERGE_HEAD_SHA}" ]; then
            if git fetch --no-tags --depth=1 origin "${MERGE_BASE_SHA}"; then
              files="$(git diff --name-only "${MERGE_BASE_SHA}" "${MERGE_HEAD_SHA}")" || {
                echo "::warning::Could not diff the merge group; using full scope"
                files=""
              }
            else
              echo "::warning::Could not fetch the merge-group base; using full scope"
            fi
          fi
          printf '%s\n' "${files}" |
            bash packages/tools/src/scripts/classify-ci-changes.sh >> "${GITHUB_OUTPUT}"

  build:
    name: Build & static checks
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm biome check .
      - run: pnpm check:ui
      - name: Validate workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-linux
          path: |
            packages/*/dist
            packages/server/public
          include-hidden-files: true
          retention-days: 2

  linux-server:
    name: Linux / Server (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2] }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm --filter @tinyrack/issuary-server test --run
          --shard=${{ matrix.shard }}/2

  linux-tools:
    name: Linux / Tools
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tinyrack/issuary-tools test --run

  linux-frontend-unit:
    name: Linux / Frontend unit
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm --filter @tinyrack/issuary-frontend exec playwright install --with-deps
          ${{ (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')) && 'chromium firefox' || 'chromium' }}
      - env:
          VITEST_BROWSER_SET: ${{ (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')) && '' || 'chromium' }}
        run: pnpm --filter @tinyrack/issuary-frontend test:unit --run

  linux-standalone:
    name: Linux / Standalone
    needs: [changes, build]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.changes.outputs.standalone == 'true' || needs.changes.outputs.server == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with: { name: dist-linux, path: packages }
      - run: >-
          pnpm --filter @tinyrack/issuary-standalone test:prepared --run &&
          pnpm --filter @tinyrack/issuary-standalone test:dist:prepared

  linux-example-smoke:
    name: Linux / Example smoke
    needs: [changes, build]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.changes.outputs.examples == 'true' || needs.changes.outputs.server == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with: { name: dist-linux, path: packages }
      - run: pnpm --filter @issuary-server-examples/node-hono-sqlite test:prepared

  frontend-smoke:
    name: Linux / Frontend smoke (${{ matrix.shard }}/2)
    needs: [changes, build]
    if: >-
      always() && github.event_name == 'pull_request' && needs.build.result == 'success' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.server == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2] }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with: { name: dist-linux, path: packages }
      - run: pnpm --filter @tinyrack/issuary-frontend exec playwright install --with-deps chromium
      - env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-${{ matrix.shard }}.zip
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-${{ matrix.shard }}
        run: >-
          pnpm --filter @tinyrack/issuary-frontend test:e2e:smoke
          --shard=${{ matrix.shard }}/2 --workers=100% --reporter=blob,html
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-smoke-${{ matrix.shard }}
          path: |
            packages/frontend/blob-report
            packages/frontend/playwright-report-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14

  homepage:
    name: Homepage
    needs: changes
    if: needs.changes.outputs.homepage == 'true' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tinyrack/issuary-homepage exec playwright install --with-deps chromium
      - run: pnpm --filter @tinyrack/issuary-homepage build
      - run: pnpm --filter @tinyrack/issuary-homepage test:audit
      - run: pnpm --filter @tinyrack/issuary-homepage deploy:dry-run

  performance-smoke:
    name: Performance smoke
    needs: changes
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tinyrack/issuary-server test:perf:smoke

  chromium-e2e:
    name: Chromium E2E (${{ matrix.shard }}/6)
    needs: [changes, build]
    if: >-
      always() && needs.build.result == 'success' &&
      (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'merge_group' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.server == 'true')))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4, 5, 6] }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with: { name: dist-linux, path: packages }
      - run: pnpm --filter @tinyrack/issuary-frontend exec playwright install --with-deps chromium
      - env:
          ISSUARY_E2E_EXCLUDE_SCREEN_LAB: '1'
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-${{ matrix.shard }}.zip
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-${{ matrix.shard }}
        run: >-
          pnpm --filter @tinyrack/issuary-frontend test:e2e
          --project='*:chromium' --shard=${{ matrix.shard }}/6
          --workers=100% --reporter=blob,html
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chromium-e2e-${{ matrix.shard }}
          path: |
            packages/frontend/blob-report
            packages/frontend/playwright-report-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14

  firefox-smoke:
    name: Firefox E2E smoke
    needs: [changes, build]
    if: >-
      always() && github.event_name == 'merge_group' && needs.build.result == 'success' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.server == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with: { name: dist-linux, path: packages }
      - run: pnpm --filter @tinyrack/issuary-frontend exec playwright install --with-deps firefox
      - env:
          ISSUARY_E2E_EXCLUDE_SCREEN_LAB: '1'
        run: >-
          pnpm --filter @tinyrack/issuary-frontend test:e2e
          --project='minimal:firefox' --workers=100%

  firefox-e2e:
    name: Firefox E2E (${{ matrix.shard }}/6)
    needs: [changes, build]
    if: >-
      always() && needs.build.result == 'success' &&
      (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4, 5, 6] }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with: { name: dist-linux, path: packages }
      - run: pnpm --filter @tinyrack/issuary-frontend exec playwright install --with-deps firefox
      - env:
          ISSUARY_E2E_EXCLUDE_SCREEN_LAB: '1'
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-firefox-${{ matrix.shard }}.zip
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-firefox-${{ matrix.shard }}
        run: >-
          pnpm --filter @tinyrack/issuary-frontend test:e2e
          --project='*:firefox' --shard=${{ matrix.shard }}/6
          --workers=100% --reporter=blob,html
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: firefox-e2e-${{ matrix.shard }}
          path: |
            packages/frontend/blob-report
            packages/frontend/playwright-report-firefox-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Coverage / ${{ matrix.name }}
    needs: changes
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Server, package: server, command: pnpm --filter @tinyrack/issuary-server test:coverage }
          - name: Frontend
            package: frontend
            command: pnpm --filter @tinyrack/issuary-frontend test:coverage
            browsers: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - if: matrix.browsers == true
        run: pnpm --filter @tinyrack/issuary-frontend exec playwright install --with-deps chromium
      - run: ${{ matrix.command }}
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage
          if-no-files-found: warn
          retention-days: 14

  performance:
    name: Performance (${{ matrix.shard }}/4)
    needs: changes
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4] }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - env:
          ISSUARY_PERF_REPORT_PATH: performance-results/shard-${{ matrix.shard }}-of-4.json
        run: pnpm --filter @tinyrack/issuary-server test:perf --shard=${{ matrix.shard }}/4
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: performance-${{ matrix.shard }}
          path: packages/server/performance-results/shard-${{ matrix.shard }}-of-4.json
          if-no-files-found: warn
          retention-days: 14

  windows-build:
    name: Windows / Build
    needs: changes
    if: >-
      github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'merge_group' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.server == 'true' ||
      needs.changes.outputs.standalone == 'true'))
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm biome check .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-windows
          path: |
            packages/*/dist
            packages/server/public
          include-hidden-files: true
          retention-days: 2

  windows-server:
    name: Windows / Server (${{ matrix.shard }}/2)
    needs: changes
    if: >-
      (github.event_name == 'merge_group' && needs.changes.outputs.server == 'true') ||
      github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2] }
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm --filter @tinyrack/issuary-server test --run
          --shard=${{ matrix.shard }}/2

  windows-tools:
    name: Windows / Tools
    needs: changes
    if: >-
      (github.event_name == 'merge_group' && needs.changes.outputs.tools == 'true') ||
      github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tinyrack/issuary-tools test --run

  windows-frontend-unit:
    name: Windows / Frontend unit
    needs: changes
    if: >-
      (github.event_name == 'merge_group' && needs.changes.outputs.frontend == 'true') ||
      github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm --filter @tinyrack/issuary-frontend exec playwright install
          ${{ (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')) && 'chromium firefox' || 'chromium' }}
      - env:
          VITEST_BROWSER_SET: ${{ (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')) && '' || 'chromium' }}
        run: pnpm --filter @tinyrack/issuary-frontend test:unit --run

  windows-standalone:
    name: Windows / Standalone
    needs: [changes, windows-build]
    if: >-
      always() && needs.windows-build.result == 'success' &&
      (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'merge_group' &&
      (needs.changes.outputs.standalone == 'true' || needs.changes.outputs.server == 'true')))
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with: { name: dist-windows, path: packages }
      - run: pnpm --filter @tinyrack/issuary-standalone test:prepared --run
      - run: pnpm --filter @tinyrack/issuary-standalone test:dist:prepared

  windows-smoke:
    name: Windows / smoke (${{ matrix.shard }}/2)
    needs: [changes, build]
    if: >-
      always() && needs.build.result == 'success' &&
      (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'merge_group' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.server == 'true')))
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2] }
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with: { name: dist-linux, path: packages }
      - run: pnpm --filter @tinyrack/issuary-frontend exec playwright install chromium
      - env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-smoke-${{ matrix.shard }}.zip
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-smoke-${{ matrix.shard }}
        run: >-
          pnpm --filter @tinyrack/issuary-frontend test:e2e:smoke
          --shard=${{ matrix.shard }}/2 --workers=100% --reporter=blob,html
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-smoke-${{ matrix.shard }}
          path: |
            packages/frontend/blob-report
            packages/frontend/playwright-report-smoke-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14

  windows-screen:
    name: Windows / screen (${{ matrix.shard }}/2)
    needs: [changes, build]
    if: >-
      always() && needs.build.result == 'success' &&
      (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'merge_group' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.server == 'true')))
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2] }
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with: { name: dist-linux, path: packages }
      - run: pnpm --filter @tinyrack/issuary-frontend exec playwright install chromium
      - env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-screen-${{ matrix.shard }}.zip
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-screen-${{ matrix.shard }}
        run: >-
          pnpm --filter @tinyrack/issuary-frontend test:e2e:screen
          --shard=${{ matrix.shard }}/2 --workers=100% --reporter=blob,html
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-screen-${{ matrix.shard }}
          path: |
            packages/frontend/blob-report
            packages/frontend/playwright-report-screen-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14

  docker-build:
    name: Docker build
    needs: changes
    if: >-
      github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'merge_group' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.server == 'true' ||
      needs.changes.outputs.standalone == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./packages/standalone/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  quality-gate:
    name: Quality Gate
    if: always()
    needs:
      - changes
      - build
      - linux-server
      - linux-tools
      - linux-frontend-unit
      - linux-standalone
      - linux-example-smoke
      - frontend-smoke
      - homepage
      - performance-smoke
      - chromium-e2e
      - firefox-smoke
      - firefox-e2e
      - coverage
      - performance
      - windows-build
      - windows-server
      - windows-tools
      - windows-frontend-unit
      - windows-standalone
      - windows-smoke
      - windows-screen
      - docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: >-
          jq -e 'all(.[]; .result == "success" or .result == "skipped")
          and (.changes.result == "success")' <<< "$QUALITY_RESULTS"

  docker-push:
    name: Docker push
    needs: [quality-gate, docker-build]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.quality-gate.result == 'success'
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.3.0
      - uses: docker/setup-buildx-action@v4.3.0
      - env: { DOCKERHUB_TOKEN: '${{ secrets.DOCKERHUB_TOKEN }}' }
        run: test -n "$DOCKERHUB_TOKEN"
      - uses: docker/login-action@v4.6.0
        with: { registry: '${{ env.GHCR_REGISTRY }}', username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/login-action@v4.6.0
        with: { registry: '${{ env.DOCKERHUB_REGISTRY }}', username: '${{ env.DOCKERHUB_USERNAME }}', password: '${{ secrets.DOCKERHUB_TOKEN }}' }
      - id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=sha
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./packages/standalone/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm-publish:
    name: Publish to npm
    needs: quality-gate
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.quality-gate.result == 'success'
    runs-on: ubuntu-24.04
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with: { cache: pnpm, node-version: 24, registry-url: 'https://registry.npmjs.org' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cp readme.md packages/server/readme.md
      - run: pnpm publish --filter @tinyrack/issuary-server --access public --no-git-checks
