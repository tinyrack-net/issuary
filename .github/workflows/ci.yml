name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: tinyrack-net/tinyauth
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_USERNAME: tinyrack
  DOCKERHUB_IMAGE_NAME: tinyrack/tinyauth

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm biome check .

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: packages/*/dist

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download dist artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist

      - name: Backend tests
        run: pnpm --filter @tinyrack/tinyauth-server test

      - name: Install Playwright browsers for frontend unit tests
        run: pnpm --filter @tinyrack/tinyauth-frontend exec playwright install --with-deps chromium firefox

      - name: Frontend unit tests
        run: pnpm --filter @tinyrack/tinyauth-frontend test:unit

      - name: Standalone tests
        run: pnpm --filter @tinyrack/tinyauth-standalone test

      - name: Standalone dist tests
        run: pnpm --filter @tinyrack/tinyauth-standalone test:dist

      - name: Frontend smoke E2E
        run: pnpm --filter @tinyrack/tinyauth-frontend run test:e2e:smoke

  homepage:
    name: Homepage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @tinyrack/tinyauth-homepage exec playwright install --with-deps chromium

      - name: Build homepage
        run: pnpm --filter @tinyrack/tinyauth-homepage run build

      - name: Audit homepage
        run: pnpm --filter @tinyrack/tinyauth-homepage run test:audit

      - name: Verify Cloudflare deployment bundle
        run: pnpm --filter @tinyrack/tinyauth-homepage run deploy:dry-run
  performance-shard:
    name: Performance (${{ matrix.shard }}/4)
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run performance tests
        env:
          TINYAUTH_PERF_REPORT_PATH: performance-results/shard-${{ matrix.shard }}-of-4.json
        run: pnpm --filter @tinyrack/tinyauth-server test:perf --shard=${{ matrix.shard }}/4

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: performance-shard-${{ matrix.shard }}-of-4
          path: packages/server/performance-results/shard-${{ matrix.shard }}-of-4.json
          if-no-files-found: error
          retention-days: 14

  performance:
    name: Performance
    needs: performance-shard
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shard reports
        id: download-shards
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: performance-shard-*-of-4
          path: packages/server/performance-results/shards
          merge-multiple: true

      - name: Download previous main performance report
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packages/server/performance-results/baseline
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&event=push&per_page=20" --jq '.workflow_runs[0].id // empty')
          artifact_id=""
          if [ -n "$run_id" ]; then
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?name=performance-report" --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
          fi
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > performance-baseline.zip
            unzip -q performance-baseline.zip -d packages/server/performance-results/baseline
          else
            echo "No previous main performance report found"
          fi

      - name: Aggregate performance reports
        id: aggregate
        continue-on-error: true
        working-directory: packages/server
        run: >-
          pnpm exec tsx ./scripts/aggregate-perf-reports.ts
          --output performance-results/performance-report.json
          --summary performance-results/performance-summary.md
          --baseline performance-results/baseline/performance-report.json
          performance-results/shards/shard-1-of-4.json
          performance-results/shards/shard-2-of-4.json
          performance-results/shards/shard-3-of-4.json
          performance-results/shards/shard-4-of-4.json

      - name: Add performance job summary
        if: always()
        run: |
          if [ -f packages/server/performance-results/performance-summary.md ]; then
            cat packages/server/performance-results/performance-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload merged performance report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: performance-report
          path: packages/server/performance-results/performance-report.json
          if-no-files-found: warn
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 14 }}

      - name: Verify performance result
        env:
          PERFORMANCE_RESULT: ${{ needs.performance-shard.result }}
          AGGREGATION_RESULT: ${{ steps.aggregate.outcome }}
        run: |
          if [ "$PERFORMANCE_RESULT" != "success" ]; then
            echo "Performance shards finished with result: $PERFORMANCE_RESULT"
            exit 1
          fi
          if [ "$AGGREGATION_RESULT" != "success" ]; then
            echo "Performance aggregation finished with result: $AGGREGATION_RESULT"
            exit 1
          fi
  windows-compatibility:
    name: Windows Compatibility
    needs: build
    runs-on: windows-latest

    steps:
      - name: Disable Git CRLF conversion
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm biome check .

      - name: Backend tests
        run: pnpm --filter @tinyrack/tinyauth-server test --run

      - name: Tools tests
        run: pnpm --filter @tinyrack/tinyauth-tools test --run

      - name: Standalone tests
        run: pnpm --filter @tinyrack/tinyauth-standalone test --run

      - name: Install Playwright browsers for frontend tests
        run: pnpm --filter @tinyrack/tinyauth-frontend exec playwright install chromium firefox

      - name: Frontend unit tests
        run: pnpm --filter @tinyrack/tinyauth-frontend test:unit --run

      - name: Frontend smoke E2E
        run: pnpm --filter @tinyrack/tinyauth-frontend run test:e2e:smoke

  docker-build:
    name: Docker Build
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./packages/standalone/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-push:
    name: Docker Push
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Missing Docker Hub configuration. Set DOCKERHUB_TOKEN as a repository secret."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v6.1.0
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=sha
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./packages/standalone/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm-publish:
    name: Publish to npm
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          cache: pnpm
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Copy README to package
        run: cp readme.md packages/server/readme.md

      - name: Publish
        run: pnpm publish --filter @tinyrack/tinyauth-server --access public --no-git-checks
