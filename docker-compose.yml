services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    image: tinyauth:latest
    container_name: tinyauth
    ports:
      - "8080:8080"
    volumes:
      # 설정 파일 (필수)
      - ./config.yaml:/opt/config.yaml:ro
      # 커스텀 프론트엔드 (선택) - 주석 해제하여 사용
      # - ./custom-public:/app/packages/backend/public:ro
      # SQLite DB 영속성 (선택, SQLite 사용 시)
      # - ./data:/app/packages/backend/data
    environment:
      - NODE_ENV=production
      # OAuth 환경변수 (필요시 설정)
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      # Database 환경변수 (PostgreSQL 사용 시)
      # - DATABASE_URL=${DATABASE_URL:-}
      # - DATABASE_PORT=${DATABASE_PORT:-}
      # - DATABASE_NAME=${DATABASE_NAME:-}
      # - DATABASE_USER=${DATABASE_USER:-}
      # - DATABASE_PASSWORD=${DATABASE_PASSWORD:-}
    # 보안 강화 옵션
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    user: "1001:1001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/.well-known/openid-configuration').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
