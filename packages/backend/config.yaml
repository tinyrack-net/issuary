basic_authentication_methods:
  password:
    enabled: true
    email_verification: true
    second_factor:
      required: true
    totp:
      enabled: false
      issuer: tinyrack
  passkey:
    enabled: true

oauth_authentication_methods:
  - id: github
    type: github
    enabled: true
    display_name: GitHub
    client_id: !env GITHUB_CLIENT_ID
    client_secret: !env GITHUB_CLIENT_SECRET
    email_conflict_strategy: auto_link
