frontend:
  mode: proxy
  path: http://localhost:8081

registration:
  enabled: true
  allowed_email_patterns: []
  email_verification_required: false
  signup_notice:
    ko: 계속하면 <a href="https://example.com/terms/ko" target="_blank">이용약관</a> 및 <a href="https://example.com/privacy/ko" target="_blank">개인정보처리방침</a>에 동의하는 것으로 간주됩니다.
    en: By continuing, you agree to our <a href="https://example.com/terms/en" target="_blank">Terms of Service</a> and <a href="https://example.com/privacy/en" target="_blank">Privacy Policy</a>.
    ja: 続行することで、<a href="https://example.com/terms/ja" target="_blank">利用規約</a>および<a href="https://example.com/privacy/ja" target="_blank">プライバシーポリシー</a>に同意したものとみなされます。

logging:
  level: trace
  format: pretty

database:
  type: sqlite
  test: true
  path: ./test.db

security:
  session_secret: 3e8a82a5d70bc32809c1757e06c3cccbc32f14dbbbded8d494983099cd84a92b
  hash_secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
  pbkdf2_iterations: 600000

auth:
  password:
    enabled: true
    two_factor:
      enrollment_required: false

terms:
  - id: tos
    required: true
    consent_mode: implicit
    version: "1.0.0"

  - id: privacy
    required: true
    consent_mode: implicit
    version: "1.0.0"

  - id: marketing2
    required: false
    consent_mode: explicit
    version: "1.0.0"

clients:
  - id: test-config-oauth-client
    name: OIDC Test Client
    logo_uri: http://localhost:3000
    client_id: sdlk3n3dkj2
    client_secret: sdlk3n3dkj2
    redirect_uris:
      - http://localhost:3000/api/callback
    response_types:
      - code
    grant_types:
      - authorization_code
      - refresh_token
    scope: openid profile email

  - id: react-spa-client
    name: React SPA Test Client (Public)
    logo_uri: http://localhost:3001
    client_id: react-spa-client
    redirect_uris:
      - http://localhost:3001/callback
    response_types:
      - code
    grant_types:
      - authorization_code
      - refresh_token
    scope: openid profile email

users:
