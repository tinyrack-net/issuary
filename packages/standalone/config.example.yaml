# Issuary standalone configuration

server:
  # Public origin used for redirects, cookies, emails, and OIDC issuer metadata.
  public_origin: ${ISSUARY_PUBLIC_ORIGIN:-http://localhost:8080}

  # Local listen port for the standalone server.
  listen_port: ${ISSUARY_LISTEN_PORT:-8080}

  # Reverse proxy trust configuration.
  # Examples: false, true, 1, "127.0.0.1", ["10.0.0.0/8", "192.168.0.0/16"]
  trust_proxy: ${ISSUARY_TRUST_PROXY:-false}

tokens:
  access_token_ttl: ${ISSUARY_ACCESS_TOKEN_TTL:-3600}
  refresh_token_ttl: ${ISSUARY_REFRESH_TOKEN_TTL:-2592000}
  key_rotation:
    enabled: ${ISSUARY_JWT_KEY_ROTATION_ENABLED:-true}
    interval_days: ${ISSUARY_JWT_KEY_ROTATION_DAYS:-30}
    overlap_days: ${ISSUARY_JWT_KEY_OVERLAP_DAYS:-7}

i18n:
  supported_languages:
    - ko
    - en
    - ja
  default_language: ${ISSUARY_DEFAULT_LANGUAGE:-auto}
  fallback_language: ${ISSUARY_FALLBACK_LANGUAGE:-en}

branding:
  # icon_url: ${ISSUARY_ICON_URL:-https://example.com/icon.svg}
  # logo_url: ${ISSUARY_LOGO_URL:-https://example.com/logo.svg}
  title:
    ko: Issuary
    en: Issuary
    ja: Issuary
  subtitle:
    ko: 만나서 반가워요!
    en: Nice to meet you!
    ja: はじめまして！
  login_method_description:
    ko: 원하는 방식으로 로그인하세요.
    en: Choose how you'd like to sign in.
    ja: お好きな方法でログインしてください。

registration:
  # Self-registration is disabled by default.
  enabled: ${ISSUARY_REGISTRATION_ENABLED:-false}
  # Optional email filters used only when registration.enabled is true.
  # Leave this empty for unrestricted signup, or add patterns such as:
  # allowed_email_patterns:
  #   - '*@example.com'
  allowed_email_patterns: []
  email_verification_required: ${ISSUARY_EMAIL_VERIFICATION_REQUIRED:-true}
  signup_notice:
    ko: 계속하면 <a href="https://example.com/terms/ko" target="_blank">이용약관</a> 및 <a href="https://example.com/privacy/ko" target="_blank">개인정보처리방침</a>에 동의하는 것으로 간주됩니다.
    en: By continuing, you agree to our <a href="https://example.com/terms/en" target="_blank">Terms of Service</a> and <a href="https://example.com/privacy/en" target="_blank">Privacy Policy</a>.
    ja: 続行することで、<a href="https://example.com/terms/ja" target="_blank">利用規約</a>および<a href="https://example.com/privacy/ja" target="_blank">プライバシーポリシー</a>に同意したものとみなされます。

account_deletion:
  enabled: ${ISSUARY_ACCOUNT_DELETION_ENABLED:-false}
  retention: ${ISSUARY_ACCOUNT_DELETION_RETENTION:-30d}

# Admin console is disabled by default. It uses the normal app session and requires an admin role.
admin:
  enabled: ${ISSUARY_ADMIN_ENABLED:-false}

logging:
  level: ${ISSUARY_LOG_LEVEL:-info}
  format: ${ISSUARY_LOG_FORMAT:-pretty}

database:
  # sqlite | postgres
  type: ${ISSUARY_DATABASE_TYPE:-sqlite}

  # sqlite settings
  path: ${ISSUARY_DATABASE_PATH:-/opt/issuary/database.db}
  test: ${ISSUARY_DATABASE_TEST:-false}
  debug: ${ISSUARY_DATABASE_DEBUG:-false}

  # postgres settings
  # host: ${ISSUARY_DATABASE_HOST:-localhost}
  # port: ${ISSUARY_DATABASE_PORT:-5432}
  # user: ${ISSUARY_DATABASE_USER:-postgres}
  # password: ${ISSUARY_DATABASE_PASSWORD:-postgres}
  # name: ${ISSUARY_DATABASE_NAME:-issuary}
  # driver_options:
  #   ssl: true

security:
  session_secret: ${ISSUARY_SESSION_SECRET}
  hash_secret: ${ISSUARY_HASH_SECRET}
  pbkdf2_iterations: ${ISSUARY_PBKDF2_ITERATIONS:-600000}

auth:
  password:
    enabled: ${ISSUARY_PASSWORD_ENABLED:-true}
    two_factor:
      enrollment_required: ${ISSUARY_PASSWORD_2FA_ENROLLMENT_REQUIRED:-false}
    totp:
      enabled: ${ISSUARY_PASSWORD_TOTP_ENABLED:-false}
      issuer: ${ISSUARY_PASSWORD_TOTP_ISSUER:-Issuary}
    policy:
      min_length: ${ISSUARY_PASSWORD_MIN_LENGTH:-8}
      max_length: ${ISSUARY_PASSWORD_MAX_LENGTH:-128}
  passkey:
    enabled: ${ISSUARY_PASSKEY_ENABLED:-false}
    # rp_id: ${ISSUARY_PASSKEY_RP_ID:-example.com}
    # origins:
    #   - https://auth.example.com
    #   - https://app.example.com

# Optional email delivery. Required for password signup verification
# and password reset emails.
# email:
#   transport: smtp
#   host: ${ISSUARY_EMAIL_HOST:-smtp.example.com}
#   port: ${ISSUARY_EMAIL_PORT:-465}
#   secure: ${ISSUARY_EMAIL_SECURE:-true}
#   user: ${ISSUARY_EMAIL_USER}
#   password: ${ISSUARY_EMAIL_PASSWORD}
#   from: ${ISSUARY_EMAIL_FROM:-no-reply@example.com}
#
# Test transport example:
# email:
#   transport: test
#   from: ${ISSUARY_EMAIL_FROM:-no-reply@example.com}

scheduler:
  enabled: ${ISSUARY_SCHEDULER_ENABLED:-true}
  mode: ${ISSUARY_SCHEDULER_MODE:-croner}
  cleanup_cron: ${ISSUARY_SCHEDULER_CLEANUP_CRON:-0 2 * * *}
  # Database scheduler mode only. Leave instance_id empty to generate a
  # unique per-process id automatically; if set manually, it must be unique
  # for every replica/process that runs the scheduler.
  poll_interval_ms: ${ISSUARY_SCHEDULER_POLL_INTERVAL_MS:-5000}
  lock_ttl_ms: ${ISSUARY_SCHEDULER_LOCK_TTL_MS:-60000}
  background_retry_delay_ms: ${ISSUARY_SCHEDULER_BACKGROUND_RETRY_DELAY_MS:-1000}
  background_max_attempts: ${ISSUARY_SCHEDULER_BACKGROUND_MAX_ATTEMPTS:-3}
  # Retains terminal background jobs (succeeded/failed) for 7 days by default.
  # Pending/running jobs are never deleted by this retention cleanup.
  background_retention_ms: ${ISSUARY_SCHEDULER_BACKGROUND_RETENTION_MS:-604800000}
  instance_id: ${ISSUARY_SCHEDULER_INSTANCE_ID:-}

cleanup:
  revoked_tokens:
    enabled: ${ISSUARY_CLEANUP_REVOKED_TOKENS_ENABLED:-true}
    retention: ${ISSUARY_CLEANUP_REVOKED_TOKENS_RETENTION:-0}
  oauth_codes:
    enabled: ${ISSUARY_CLEANUP_OAUTH_CODES_ENABLED:-true}
    consumed_retention: ${ISSUARY_CLEANUP_OAUTH_CODES_RETENTION:-24h}
  email_verifications:
    enabled: ${ISSUARY_CLEANUP_EMAIL_VERIFICATIONS_ENABLED:-true}
    retention: ${ISSUARY_CLEANUP_EMAIL_VERIFICATIONS_RETENTION:-0}
  password_resets:
    enabled: ${ISSUARY_CLEANUP_PASSWORD_RESETS_ENABLED:-true}
    retention: ${ISSUARY_CLEANUP_PASSWORD_RESETS_RETENTION:-0}
  pending_oauth_registrations:
    enabled: ${ISSUARY_CLEANUP_PENDING_OAUTH_REGISTRATIONS_ENABLED:-true}
    retention: ${ISSUARY_CLEANUP_PENDING_OAUTH_REGISTRATIONS_RETENTION:-0}

terms:
  - id: tos
    required: true
    consent_mode: implicit
    version: "1.0.0"
    content:
      ko:
        title: 이용약관
        type: text
        content: |
          서비스 이용약관 내용
      en:
        title: Terms of Service
        type: text
        content: |
          Terms of Service content
      ja:
        title: 利用規約
        type: text
        content: |
          利用規約の内容

clients:
  - id: example-client
    name: Example Web App
    client_id: ${ISSUARY_CLIENT_ID:-example-client}
    client_secret: ${ISSUARY_CLIENT_SECRET:-example-client-secret}
    redirect_uris:
      - http://localhost:3000/callback
    response_types:
      - code
    grant_types:
      - authorization_code
      - refresh_token
    scope: openid profile email

users:
  - sub: admin-user
    email: admin@example.com
    password: ${ISSUARY_ADMIN_PASSWORD:-changeme}
    role: admin

identity_providers: []
